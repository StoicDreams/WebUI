name: Test Web UI

# Builds and tests the crates. The Web UI website is in the WebUIWeb repo, which deploys it.

on:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set Target
        run: |
          rustup update
          rustup target add wasm32-unknown-unknown
      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build
      - name: Run Tests
        run: cargo test
